name: Verify
on:
  push:
  pull_request:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: read
jobs:
  verification:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            test_architecture: X64
          - runner: ubuntu-24.04-arm
            test_architecture: Arm64
          - runner: windows-2025
            test_architecture: X64
          - runner: macos-15
            test_architecture: Arm64
    runs-on: ${{ matrix.runner }}
    env:
      EXPECTED_TEST_ARCH: ${{ matrix.test_architecture }}
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet --info > artifacts/runtime.txt
          python3 scripts/record-build.py > artifacts/build-provenance.json
          bash scripts/verify.sh 2>&1 | tee artifacts/verify.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ matrix.runner }}
          path: |
            artifacts/verify.log
            artifacts/runtime.txt
            artifacts/build-provenance.json
            artifacts/verification.*
            artifacts/package-smoke.*/feed
          if-no-files-found: warn
